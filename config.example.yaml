# rss2epub configuration
# Copy this file to config.yaml and edit as needed.
#
# This tool fetches publicly available RSS/Atom feeds and article pages
# for personal offline reading. It never bypasses paywalls, logins,
# CAPTCHAs, robots.txt, or other access controls.

outputDir: ./output
database: ./data/cache.sqlite
userAgent: "rss2epub/1.0 (personal offline EPUB reader)"
concurrency: 3
timeoutMs: 20000
maxArticlesPerFeed: 30
rateLimitMs: 1500
timezone: Asia/Tokyo
respectRobotsTxt: false

playwright:
  enabled: true
  headless: true
  # Optional: path to a Playwright storageState JSON produced by a
  # normal, interactive login. Used only for legitimate authenticated
  # access. Never used to circumvent paywalls.
  # storageState: ./data/playwright-state.json

epub:
  titlePrefix: japan-news
  author: rss2epub
  splitByCategory: false
  writingMode: horizontal # horizontal | vertical
  embedImages: true
  maxImageBytes: 2500000

server:
  host: 0.0.0.0
  port: 8080

# Corporate TLS inspection: either set NODE_EXTRA_CA_CERTS / NODE_OPTIONS=--use-system-ca,
# or point extraCaFile at your organization's root CA PEM.
# tls:
#   extraCaFile: ./corp-root.pem

# Feed URLs change. Disable a feed if its URL 404s, and prefer the
# publisher's official RSS/Atom listing page when adding new sources.
feeds:
  - name: NHK
    url: "https://www3.nhk.or.jp/rss/news/cat0.xml"
    category: ニュース
    enabled: true
    extractor: nhk

